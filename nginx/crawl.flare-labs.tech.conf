# FlareCrawl — crawl.flare-labs.tech
# Proxied through Cloudflare (orange cloud) -> origin 80.225.220.0.
# Cloudflare terminates public TLS; origin serves HTTP :80 (CF "Flexible"/"Full").
# WebSocket upgrade is preserved so the public live view (/live/<id>/cast) works.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name crawl.flare-labs.tech;

    access_log /var/log/nginx/crawl.flare-labs.tech.access.log;
    error_log  /var/log/nginx/crawl.flare-labs.tech.error.log;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Trust Cloudflare's scheme so the gateway treats requests as HTTPS.
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket upgrade (live-view screencast + input)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
